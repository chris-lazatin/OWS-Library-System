<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0055ff">
  <title>Notifications Print Preview | OWS Library System</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="print-page">
  <main class="print-shell">
    <header class="print-toolbar">
      <div>
        <h1>Notifications Print Preview</h1>
        <p>Olongapo Wesley School, Inc. Library System</p>
      </div>
      <div class="print-actions">
        <button class="primary-button" type="button" id="printPage">Print</button>
        <button class="secondary-button print-link" type="button" id="backPage">Back</button>
      </div>
    </header>

    <section id="printDocument" class="print-document">
      <header class="print-document-header">
        <h2>Complete Notification History</h2>
        <p id="generatedDate"></p>
      </header>
      <div class="print-table-wrap">
        <table class="data-table print-table notification-print-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Message</th>
              <th>Date / Time</th>
            </tr>
          </thead>
          <tbody id="printNotificationTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="../js/pages/notificationPrint.js"></script>
</body>
</html>
